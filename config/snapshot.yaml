# The pinned inputs of every experiment. Values that exist in the system under study (the
# Dokploy versions, image digests, OpenAPI paths, Rust toolchain) are NOT repeated here: the
# harness reads them from the system's repository at `commit`, so they cannot drift apart.
snapshot: B1

system_under_study:
  name: dokploy-iac
  version: 0.1.0-beta.1
  repository: https://github.com/bernard-ng/dokploy-iac.git
  tag: eval-B1
  commit: 5d73d4b932251c9540c0a8dd6358edd5bc076d16
  # Release binaries are not bit-for-bit reproducible across machines, so the expected hash is
  # recorded per platform. A binary built elsewhere is accepted with its own hash recorded in
  # every manifest (REPRODUCING.md, "The release binary").
  release_binary:
    build: cargo build --release --locked --package dokploy-cli
    path_in_checkout: target/release/dokploy
    sha256:
      darwin-arm64: 55ec8a81e17841497bf50e465b6c3d31965849c594c9969d2b483280c235497c

toolchain:
  # The channel is checked against rust-toolchain.toml at the commit.
  rust: "1.97.1"
  image: docker.io/library/rust:1.97.1-bookworm
  # Filled in by `declarative-iac provenance pin-toolchain` on the first containerised build.
  image_digest: null

paths:
  versions: specs/versions.yaml
  specs: specs
  fixtures: fixtures/api/live
