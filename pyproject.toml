[project]
name = "declarative-iac"
version = "0.1.0"
description = "Evaluation harness for the report 'Declarative management over procedure-oriented APIs'"
readme = "README.md"
authors = [{ name = "bernard-ng", email = "ngandubernard@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.10.0",
    "pyyaml>=6.0.3",
    "scienceplots>=2.2.0",
    "typer>=0.21.1",
]

[project.scripts]
declarative-iac = "declarative_iac.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "pyright[nodejs]>=1.1.408",
    "pytest>=8.4.2",
    "ruff>=0.14.13",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# typer declares options as call defaults
ignore = ["B008"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".cache"]
skips = ["B404", "B603"]
