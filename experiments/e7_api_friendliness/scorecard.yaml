# Declarative-friendliness criteria, operationalised from Google AIP-121/AIP-128 and the SUT's ADRs.
# Score each router used by the specs: yes | no | partial | n/a, with one evidence pointer.
criteria:
  standard_methods_only:     "lifecycle uses only create/get/list/update/delete; no custom setters (AIP-128/136)"
  single_write_path:         "one update operation carries every in-place field (ADR 0008 write groups count > 1 = no)"
  typed_responses:           "the 200 response schema describes the resource (ADR 0007: all empty = no)"
  create_returns_identity:   "create response carries the new id (spec create_identity: from_response)"
  consistent_schema:         "the same field has the same name and nullability on read and write (ADR 0020)"
  authoritative_collection:  "a list proves absence (not role-filtered) (spec read.list.authority)"
  user_specified_identity:   "a stable client-chosen key exists at create time (AIP-122/128)"
  no_server_side_suffixes:   "stored names equal requested names (ADR 0006 app_name suffix = no)"
  strongly_consistent_reads: "a read after a write reflects it (verification failures in E3)"
  relation_as_field:         "a membership is a field of the owner, not add/remove calls (ADR 0019 tags = no)"
  revision_or_etag:          "an etag or revision allows optimistic concurrency (AIP-154)"
  reconciling_signal:        "long-running changes expose status (deployments; AIP-128 reconciling)"
routers: {}
